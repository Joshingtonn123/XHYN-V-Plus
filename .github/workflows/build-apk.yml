name: Build XHYN V Reborn APK

on:
  push:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xhyn-v-reborn-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Rebuild from verified Hotfix 2 + current source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build unzip zip
      - name: Download and verify XHYN V 0.2 Hotfix 2 base APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xhyn-input"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 30 --max-time 900 \
            https://github.com/XHYN-PH/XHYN-V-reborn/releases/download/v0.2-hotfix2/XHYN-V-0.2-Hotfix2.apk \
            -o "$RUNNER_TEMP/xhyn-input/base.apk"
          echo "e2f1862b6deaade281be2b0f5f9c7dbf604462c7dccf2b9b951977327b3518f8  $RUNNER_TEMP/xhyn-input/base.apk" | sha256sum --check -
      - name: Download and verify pinned Android tools
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          root = pathlib.Path("modifications")
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "xhyn-tools"
          out.mkdir(parents=True, exist_ok=True)
          items = json.loads((root / "android-toolchain-manifest.json").read_text())
          for item in items:
              print("Downloading", item["name"], flush=True)
              with urllib.request.urlopen(item["url"], timeout=180) as response:
                  data = response.read()
              if "archive_sha1" in item:
                  actual = hashlib.sha1(data).hexdigest()
                  if actual != item["archive_sha1"]:
                      raise SystemExit("Archive SHA-1 mismatch: " + item["name"])
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      matches = [name for name in archive.namelist() if name.endswith(item["member_suffix"])]
                      if len(matches) != 1:
                          raise SystemExit("Expected exactly one archive member for " + item["name"])
                      payload = archive.read(matches[0])
              else:
                  payload = data
              if hashlib.sha256(payload).hexdigest() != item["sha256"]:
                  raise SystemExit("SHA-256 mismatch: " + item["name"])
              (out / item["name"]).write_bytes(payload)
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - name: Download and verify Apktool 2.12.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xhyn-tools"
          curl --fail --location --silent --show-error \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
            -o "$RUNNER_TEMP/xhyn-tools/apktool.jar"
          echo "66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  $RUNNER_TEMP/xhyn-tools/apktool.jar" | sha256sum --check -
      - name: Download and verify Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip \
            -o "$RUNNER_TEMP/android-ndk-r27c.zip"
          echo "090e8083a715fdb1a3e402d0763c388abb03fb4e  $RUNNER_TEMP/android-ndk-r27c.zip" | sha1sum --check -
          mkdir -p "$RUNNER_TEMP/xhyn-ndk"
          unzip -q "$RUNNER_TEMP/android-ndk-r27c.zip" -d "$RUNNER_TEMP/xhyn-ndk"
          test -f "$RUNNER_TEMP/xhyn-ndk/android-ndk-r27c/source.properties"
          grep -q 'Pkg.Revision = 27.2.12479018' "$RUNNER_TEMP/xhyn-ndk/android-ndk-r27c/source.properties"
      - name: Build and sign this commit's APK
        env:
          XHYN_SIGNING_KEY_BASE64: ${{ secrets.XHYN_SIGNING_KEY_BASE64 }}
          XHYN_SIGNING_KEY_ALIAS: ${{ secrets.XHYN_SIGNING_KEY_ALIAS }}
          XHYN_SIGNING_PASSWORD: ${{ secrets.XHYN_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "@@DOLLAR${{XHYN_SIGNING_KEY_BASE64:-}" || -z "@@DOLLAR${{XHYN_SIGNING_KEY_ALIAS:-}" || -z "@@DOLLAR${{XHYN_SIGNING_PASSWORD:-}" ]]; then
            echo "::error::Configure repository secrets XHYN_SIGNING_KEY_BASE64, XHYN_SIGNING_KEY_ALIAS and XHYN_SIGNING_PASSWORD. Keep one persistent keystore for all future builds."
            exit 1
          fi
          printf '%s' "$XHYN_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/xhyn-release.p12"
          printf '%s' "$XHYN_SIGNING_PASSWORD" > "$RUNNER_TEMP/xhyn-signing-password.txt"
          python modifications/v0.2/build_hotfix2.py \
            --input-apk "$RUNNER_TEMP/xhyn-input/base.apk" \
            --work-dir "$RUNNER_TEMP/xhyn-work" \
            --tools-dir "$RUNNER_TEMP/xhyn-tools" \
            --apktool "$RUNNER_TEMP/xhyn-tools/apktool.jar" \
            --ndk-root "$RUNNER_TEMP/xhyn-ndk/android-ndk-r27c" \
            --keystore "$RUNNER_TEMP/xhyn-release.p12" \
            --key-alias "$XHYN_SIGNING_KEY_ALIAS" \
            --password-file "$RUNNER_TEMP/xhyn-signing-password.txt"
      - name: Upload freshly built APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-V-Reborn-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/xhyn-work/*.apk
            ${{ runner.temp }}/xhyn-work/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-V-Reborn-build-reports-${{ github.run_number }}
          path: ${{ runner.temp }}/xhyn-work/reports/
          if-no-files-found: ignore
          retention-days: 14
